<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Classroom SimCity</title>
  <link rel="stylesheet" href="/main.css">
</head>
<body class="page-body">
  <div class="page-container wide">
    <h1>Leaderboard</h1>
    <p id="leaderboard-status" class="subtitle"></p>
    <div class="table-wrap">
      <table id="leaderboard-table" class="data-table">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Username</th>
            <th>Best Score</th>
            <th>Residents</th>
            <th>Resilience</th>
            <th>Casualties</th>
            <th>Injured</th>
            <th>Disaster $</th>
            <th>Sessions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p><a href="/">← Back to Game</a></p>
  </div>
  <script type="module" src="./scripts/pages/leaderboard.js"></script>
</body>
</html>
